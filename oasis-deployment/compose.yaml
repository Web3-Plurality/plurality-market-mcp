services:
  #######
  # MCP Server
  #######
  plurality-market-mcp-dev:
    container_name: plurality-market-mcp-dev
    image: ghcr.io/web3-plurality/plurality-market-mcp-pre:latest
    environment:
      MCP_RESOURCE_URL: https://${PLURALITY_DOMAIN}
      BACKEND_API_URL: https://${PLURALITY_DOMAIN}/api
    restart: always